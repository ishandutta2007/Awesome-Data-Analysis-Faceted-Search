<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="420" style="background: #090d16; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#070b14" />
    </linearGradient>

    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)" />
    </linearGradient>

    <linearGradient id="glow-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glow-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <!-- Filter Effects -->
    <filter id="blur-bg" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" />
    </filter>

    <filter id="glow-badge" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes floatPill1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes floatPill2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(6px); }
    }
    @keyframes floatPill3 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes barPulse {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(1.3); }
    }
    .orb-1 { animation: pulseGlow 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseGlow 10s ease-in-out infinite 3s; transform-origin: 1000px 300px; }
    .floating-1 { animation: floatPill1 5s ease-in-out infinite; }
    .floating-2 { animation: floatPill2 6s ease-in-out infinite 1s; }
    .floating-3 { animation: floatPill3 5.5s ease-in-out infinite 2s; }
    .flow-line { stroke-dasharray: 6 6; animation: dashMove 3s linear infinite; }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="420" fill="url(#bg-grad)" />

  <!-- Animated Glowing Ambient Orbs (Strictly Background) -->
  <g filter="url(#blur-bg)">
    <circle cx="220" cy="120" r="140" fill="url(#glow-cyan)" class="orb-1" />
    <circle cx="980" cy="280" r="170" fill="url(#glow-purple)" class="orb-2" />
  </g>

  <!-- Tech Grid Background Pattern -->
  <g stroke="rgba(255, 255, 255, 0.04)" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Decorative Connected Data Flow Lines -->
  <path d="M 120 330 Q 300 370 600 340 T 1080 320" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="2" class="flow-line" />
  <path d="M 150 90 Q 500 50 800 85 T 1050 110" fill="none" stroke="rgba(192, 132, 252, 0.2)" stroke-width="1.5" class="flow-line" />

  <!-- Animated Faceted Data Cards / Micro-Pills (Placed on bottom corners to avoid text overlap) -->
  <g class="floating-1">
    <g transform="translate(60, 240)">
      <rect width="180" height="42" rx="10" fill="url(#card-grad)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.2" />
      <circle cx="24" cy="21" r="5" fill="#38bdf8" />
      <text x="38" y="26" fill="#cbd5e1" font-size="13" font-weight="600">Elasticsearch / Aggs</text>
    </g>
  </g>

  <g class="floating-2">
    <g transform="translate(960, 100)">
      <rect width="175" height="42" rx="10" fill="url(#card-grad)" stroke="rgba(168, 85, 247, 0.35)" stroke-width="1.2" />
      <circle cx="24" cy="21" r="5" fill="#c084fc" />
      <text x="38" y="26" fill="#cbd5e1" font-size="13" font-weight="600">Meilisearch / Facets</text>
    </g>
  </g>

  <g class="floating-3">
    <g transform="translate(950, 260)">
      <rect width="190" height="42" rx="10" fill="url(#card-grad)" stroke="rgba(129, 140, 248, 0.35)" stroke-width="1.2" />
      <circle cx="24" cy="21" r="5" fill="#818cf8" />
      <text x="38" y="26" fill="#cbd5e1" font-size="13" font-weight="600">Typesense / Buckets</text>
    </g>
  </g>

  <g class="floating-2">
    <g transform="translate(70, 90)">
      <rect width="170" height="42" rx="10" fill="url(#card-grad)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.2" />
      <circle cx="24" cy="21" r="5" fill="#38bdf8" />
      <text x="38" y="26" fill="#cbd5e1" font-size="13" font-weight="600">Vespa / Grouping</text>
    </g>
  </g>

  <!-- FOREGROUND CONTENT: Header Category Badge, Title, Subtitle, Key Feature Pills -->
  <g id="foreground-content">
    <!-- Category Badge -->
    <g transform="translate(470, 52)">
      <rect width="260" height="30" rx="15" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.45)" stroke-width="1" />
      <circle cx="20" cy="15" r="4" fill="#38bdf8" />
      <text x="34" y="20" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1.5">DATA ANALYSIS &amp; SEARCH</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="145" text-anchor="middle" fill="url(#primary-grad)" font-size="44" font-weight="800" letter-spacing="-0.8">
      Awesome Faceted Search
    </text>

    <!-- Subtitle -->
    <text x="600" y="195" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="500" letter-spacing="0.2">
      Curated Ecosystem for Data Analysis, Faceted Navigation &amp; Aggregations
    </text>

    <!-- Tagline / Focus description -->
    <text x="600" y="235" text-anchor="middle" fill="#94a3b8" font-size="14.5" font-weight="400">
      SaaS Platforms &amp; Self-Hosted Open-Source Engines • Exact Pricing • Deep Architectural Benchmarks
    </text>

    <!-- Dynamic Center Feature Tags -->
    <g transform="translate(320, 275)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="170" height="34" rx="8" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
        <text x="85" y="22" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="600">⚡ Dynamic Filtering</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(190, 0)">
        <rect width="175" height="34" rx="8" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(129, 140, 248, 0.3)" stroke-width="1" />
        <text x="87" y="22" text-anchor="middle" fill="#818cf8" font-size="13" font-weight="600">📊 Aggregation Engines</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(385, 0)">
        <rect width="175" height="34" rx="8" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(192, 132, 252, 0.3)" stroke-width="1" />
        <text x="87" y="22" text-anchor="middle" fill="#c084fc" font-size="13" font-weight="600">🛡️ Self-Hosted OSS</text>
      </g>
    </g>

    <!-- Subtle Bottom Metrics Strip -->
    <g transform="translate(420, 355)">
      <circle cx="10" cy="10" r="4" fill="#10b981" />
      <text x="24" y="14" fill="#94a3b8" font-size="12.5" font-weight="500">Updated: 2026</text>
      <text x="140" y="14" fill="#475569" font-size="12.5">|</text>
      <text x="160" y="14" fill="#94a3b8" font-size="12.5" font-weight="500">100% Transparent Pricing</text>
      <text x="325" y="14" fill="#475569" font-size="12.5">|</text>
      <text x="345" y="14" fill="#94a3b8" font-size="12.5" font-weight="500">Production Ready</text>
    </g>
  </g>
</svg>
